[package]
name = "perch"
version = "0.1.1"
description = "Perch — an edge-docked AI assistant widget"
authors = ["Danrave"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "perch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Perch ships as a small, always-resident widget: optimize the release build for
# size and startup, not for compile time.
[profile.release]
opt-level = "s"    # size over raw speed; the hot paths are I/O bound
lto = true         # cross-crate inlining + dead-code elimination
codegen-units = 1  # better optimization at the cost of build parallelism
panic = "abort"    # no unwinding tables
strip = true       # drop debug symbols from the shipped binary

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
base64 = "0.23"
xcap = "0.9"
reqwest = { version = "0.13", features = ["json", "stream", "form", "query"] }
keyring = { version = "4", default-features = false, features = ["v1"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
pdf-extract = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Security_Cryptography",
  "Security_Cryptography_Core",
] }
